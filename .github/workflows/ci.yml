name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: go_api_starter
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Install Atlas
        uses: ariga/setup-atlas@d1698c9cc991e6d65a02ce8bb9cd69fba6223cff # v0

      - name: Run project checks
        run: task check

      - name: Run vulnerability scan
        run: task security

      - name: Validate migrations
        run: task atlas-validate

      - name: Apply MySQL migrations for integration tests
        env:
          APP_ENV: development
          GO_API_DATABASE__DRIVER: mysql
          GO_API_DATABASE__HOST: 127.0.0.1
          GO_API_DATABASE__PORT: "3306"
          GO_API_DATABASE__USERNAME: root
          GO_API_DATABASE__PASSWORD: test
          GO_API_DATABASE__DBNAME: go_api_starter
        run: task migrate

      - name: Run MySQL integration tests
        env:
          MYSQL_TEST_DSN: root:test@tcp(127.0.0.1:3306)/go_api_starter?parseTime=true&multiStatements=true
        run: task test-integration

      - name: Build Linux binary
        run: task build-linux
