# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install
# Or: brew install pre-commit && pre-commit install

repos:
  # Go project checks are routed through Taskfile.
  - repo: local
    hooks:
      - id: task-fmt
        name: task fmt
        entry: task fmt
        language: system
        pass_filenames: false
      - id: task-vet
        name: task vet
        entry: task vet
        language: system
        pass_filenames: false
      - id: task-diff-check
        name: task diff-check
        entry: task diff-check
        language: system
        pass_filenames: false

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  # golangci-lint (optional, requires golangci-lint installed)
  - repo: https://github.com/golangci/golangci-lint
    rev: v1.61.0
    hooks:
      - id: golangci-lint
        args: ['--timeout=5m']
