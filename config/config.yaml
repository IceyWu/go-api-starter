# Single configuration source.
# Select a profile with APP_ENV=development|production.
# Any GO_API_* variable overrides the final value:
# GO_API_SERVER__PORT=9000 -> server.port
# GO_API_DATABASE__PASSWORD=... -> database.password

common:
  app:
    name: go-api-starter
    jwt_secret: your-secret-key-change-in-production
    access_token_days: 7
    refresh_token_days: 30
    username_prefix: go
    admin_email: ""
    admin_password: "123456"
    docs_user: admin
    docs_password: admin123
    default_user_password: "123456"
    amap_api_key: ""

  server:
    host: localhost
    base_path: ""
    read_header_timeout: 10s
    read_timeout: 30s
    write_timeout: 60s
    idle_timeout: 120s
    shutdown_timeout: 10s
    max_header_bytes: 1048576

  database:
    charset: utf8mb4
    allow_dirty_migrations: false
    max_idle_conns: 10
    max_open_conns: 100
    conn_max_lifetime: 3600

  log:
    level: debug
    format: console
    output: stdout
    file_path: ./logs/app.log

  storage:
    endpoint: ""
    bucket: ""
    region: ""
    access_key_id: ""
    access_key_secret: ""
    upload_dir: go_oss
    public_base_url: ""
    force_path_style: false
    max_file_size: 209715200
    token_expire: 1800
    allowed_extensions: []

  redis:
    host: localhost
    port: 6379
    password: ""
    db: 0
    pool_size: 10
    min_idle_conns: 5
    max_retries: 3
    dial_timeout: 5s
    read_timeout: 3s
    write_timeout: 3s
    cluster_mode: false
    cluster_addrs: []
    enable_fallback: true
    enabled: false

  transcoding:
    enabled: false
    storage_root: videos
    mps_region: ""
    mps_pipeline_id: ""
    mps_template_original: ""
    mps_template_1080p: ""
    mps_template_720p: ""
    mps_template_480p: ""
    mps_poll_interval_sec: 10

  cors:
    allow_origins:
      - "*"
    allow_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allow_headers:
      - Origin
      - Content-Type
      - Authorization
      - X-Request-ID

  rate_limit:
    global_per_minute: 3000
    user_per_minute: 600
    login_per_minute: 60
    upload_per_minute: 300
    fallback_rps: 500
    fallback_burst: 1000

  mail:
    enabled: false
    host: smtp.qq.com
    port: 587
    user: ""
    password: ""
    from: ""
    use_tls: true
    mock_send: true

  wechat:
    appid: ""
    secret: ""

  ws:
    key: ""

development:
  app:
    env: development

  server:
    port: "9527"
    mode: debug

  database:
    driver: sqlite
    path: ./data.db
    allow_dirty_migrations: true
    host: localhost
    port: 3306
    username: root
    password: "123456"
    dbname: go_api_starter

production:
  app:
    env: production

  server:
    host: 0.0.0.0
    port: "8080"
    mode: release

  database:
    driver: mysql
    host: localhost
    port: 3306
    username: root
    password: ""
    dbname: go_api_starter

  log:
    level: info
    format: json

  redis:
    enabled: true

  mail:
    mock_send: false
