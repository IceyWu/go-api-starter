name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:26.7.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: go_api_starter
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.10.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0

      - name: Install sqlc
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/sqlc.tar.gz" \
            https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz
          echo "497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  $RUNNER_TEMP/sqlc.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/sqlc-bin"
          tar -xzf "$RUNNER_TEMP/sqlc.tar.gz" -C "$RUNNER_TEMP/sqlc-bin" sqlc
          echo "$RUNNER_TEMP/sqlc-bin" >> "$GITHUB_PATH"

      - name: Install Atlas
        uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0.3
        with:
          version: v1.3.0

      - name: Run vulnerability scan
        run: task security

      - name: Validate migrations
        run: task atlas-validate

      - name: Apply MySQL migrations for integration tests
        env:
          APP_ENV: development
          GO_API_DATABASE__DRIVER: mysql
          GO_API_DATABASE__HOST: 127.0.0.1
          GO_API_DATABASE__PORT: "3306"
          GO_API_DATABASE__USERNAME: root
          GO_API_DATABASE__PASSWORD: test
          GO_API_DATABASE__DBNAME: go_api_starter
        run: task migrate

      - name: Check source and run all tests once
        env:
          CGO_ENABLED: "1"
          MYSQL_TEST_DSN: root:test@tcp(127.0.0.1:3306)/go_api_starter?parseTime=true&multiStatements=true
          REDIS_TEST_ADDR: 127.0.0.1:6379
          REQUIRE_INTEGRATION: "true"
        run: task check-ci TEST_ARGS="-race -tags=integration -count=1"

      - name: Verify generated code is committed
        run: git diff --exit-code

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: go-api-starter:ci
          cache-from: type=gha,scope=go-api-starter
          cache-to: type=gha,scope=go-api-starter,mode=max

      - name: Smoke-test Docker stack
        run: task docker-smoke DOCKER_BUILD_ARGS=--no-build
