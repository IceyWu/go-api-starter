version: '3'

vars:
  TARGET_OS: '{{OS}}'
  TARGET_ARCH: '{{ARCH}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build an application binary (COMMAND=server, worker, or migrate)
    vars:
      COMMAND: '{{.COMMAND | default "server"}}'
    env:
      GOOS: '{{.TARGET_OS}}'
      GOARCH: '{{.TARGET_ARCH}}'
      CGO_ENABLED: '0'
    cmds:
      - go build {{.BUILD_FLAGS}} -o bin/{{.COMMAND}}{{if eq .TARGET_OS "windows"}}.exe{{end}} ./cmd/{{.COMMAND}}

  build-all:
    desc: Build server, migration, and worker binaries
    cmds:
      - task: build
        vars: {COMMAND: server, BUILD_FLAGS: '-ldflags="-s -w"'}
      - task: build
        vars: {COMMAND: migrate, BUILD_FLAGS: '-ldflags="-s -w"'}
      - task: build
        vars: {COMMAND: worker, BUILD_FLAGS: '-ldflags="-s -w"'}

  dev:
    desc: Build and run the development server
    dotenv: ['.env.dev', '.env.dev.local']
    env:
      APP_ENV: development
    cmds:
      - task: stop-dev
      - task: build
      - task: run-server

  prod:
    desc: Build and run the production server
    dotenv: ['.env.prod', '.env.prod.local']
    env:
      APP_ENV: production
    cmds:
      - task: build
      - task: run-server

  run-server:
    internal: true
    cmds:
      - ./bin/server{{if eq OS "windows"}}.exe{{end}}

  stop-dev:
    internal: true
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/stop-dev.ps1
        platforms: [windows]
      - cmd: |
          target="$(pwd)/bin/server"
          for pid in $(pgrep -f "$target" || true); do kill "$pid"; done
        platforms: [linux, darwin]

  worker:
    desc: Run the MPS polling worker
    cmds:
      - go run ./cmd/worker

  migrate:
    desc: Apply versioned SQL migrations with Atlas
    dotenv: ['.env.dev', '.env.dev.local']
    cmds:
      - go run ./cmd/migrate

  sqlc:
    desc: Regenerate type-safe SQL access code
    cmds:
      - sqlc generate

  test:
    desc: Run tests (CLI_ARGS supports -race, -count, or -tags)
    cmds:
      - go test {{.CLI_ARGS}} ./...

  test-package:
    desc: Run tests for one package
    requires:
      vars: [PACKAGE]
    cmds:
      - go test {{.CLI_ARGS}} ./{{.PACKAGE}}

  test-integration:
    desc: Run MySQL and Redis integration tests
    cmds:
      - task: test
        vars:
          CLI_ARGS: '-tags=integration {{.CLI_ARGS}}'

  fmt:
    desc: Format Go source files
    cmds:
      - go fmt ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  security:
    desc: Scan Go dependencies for known vulnerabilities
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 {{.CLI_ARGS}} ./...

  atlas-validate:
    desc: Validate migration checksums
    cmds:
      - atlas migrate validate --dir file://migrations/sqlite
      - atlas migrate validate --dir file://migrations/mysql

  atlas-hash:
    desc: Refresh checksums after editing migrations
    cmds:
      - atlas migrate hash --dir file://migrations/sqlite
      - atlas migrate hash --dir file://migrations/mysql

  check:
    desc: Verify formatting, generate, test, lint, build, and check whitespace
    cmds:
      - test -z "$(gofmt -l .)"
      - task: sqlc
      - task: test
        vars:
          CLI_ARGS: '{{.TEST_ARGS}}'
      - task: lint
      - task: build
      - task: diff-check

  diff-check:
    desc: Verify patch whitespace
    cmds:
      - git -c core.safecrlf=false diff --check

  docker-smoke:
    desc: Build and verify an isolated API/MySQL/Redis stack
    vars:
      DOCKER_BUILD_ARGS: '{{.DOCKER_BUILD_ARGS | default "--build"}}'
    cmds:
      - defer: docker compose -p go-api-starter-ci -f docker-compose.ci.yml down --volumes --remove-orphans
      - defer: docker compose -p go-api-starter-ci -f docker-compose.ci.yml logs --no-color
      - docker compose -p go-api-starter-ci -f docker-compose.ci.yml up {{.DOCKER_BUILD_ARGS}} --wait --wait-timeout 90
      - docker compose -p go-api-starter-ci -f docker-compose.ci.yml exec -T api wget -q -O - http://127.0.0.1:8080/health/ready
      - docker compose -p go-api-starter-ci -f docker-compose.ci.yml exec -T api wget -q -O - http://127.0.0.1:8080/api/v1/system/ping

  clean:
    desc: Remove build artifacts
    cmds:
      - cmd: powershell -NoProfile -Command "Remove-Item -LiteralPath bin -Recurse -Force -ErrorAction SilentlyContinue"
        platforms: [windows]
      - cmd: rm -rf bin
        platforms: [linux, darwin]

  deps:
    desc: Tidy and download Go dependencies
    cmds:
      - go mod tidy
      - go mod download

  update:
    desc: Upgrade the Go toolchain and application/test dependencies
    cmds:
      - go get go@latest
      - go get -u -t ./... {{.MODULES}}
      - go mod tidy
