# Isolated disposable stack: no host ports, dotenv files, or persistent data volumes.
services:
  mysql:
    image: mysql:26.7.0
    environment:
      MYSQL_ROOT_PASSWORD: integration-only
      MYSQL_DATABASE: go_api_starter
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pintegration-only"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:8.10.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    image: go-api-starter:ci
    build: .
    entrypoint: []
    command: ["/bin/sh", "-c", "/app/migrate && exec /app/server"]
    environment:
      APP_ENV: development
      GO_API_SERVER__HOST: 0.0.0.0
      GO_API_SERVER__PORT: "8080"
      GO_API_DATABASE__HOST: mysql
      GO_API_DATABASE__USERNAME: root
      GO_API_DATABASE__PASSWORD: integration-only
      GO_API_DATABASE__DBNAME: go_api_starter
      GO_API_REDIS__ENABLED: "true"
      GO_API_REDIS__HOST: redis
      GO_API_APP__JWT_SECRET: ci-isolated-secret-at-least-32-characters
      GO_API_MAIL__MOCK_SEND: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
